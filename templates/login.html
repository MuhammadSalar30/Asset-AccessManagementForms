{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Forms</title>

    <link rel="stylesheet" href="{% static 'Login.css' %}">
</head>

<body>

    <main class="login-layout">

        <div class="auth-form-col">

            <div class="auth-card">

                <span class="eyebrow">Welcome back</span>

                <h1>Sign in to AssetForms</h1>

                <p class="sub">
                    Enter your credentials to reach your dashboard.
                </p>


                <form method="POST" action="{% url 'login' %}">

                    {% csrf_token %}


                    <div class="form-group">
{% if messages %}
    {% for m in messages %}
        <div style="padding:10px 14px; background:#fce8e6; color:#d93025; border-radius:6px; margin-bottom:12px; font-size:14px;">{{ m }}</div>
    {% endfor %}
{% endif %}
                        <label class="field-label">
                            Email
                        </label>

                        <input
                            class="form-control"
                            type="email"
                            name="email"
                            placeholder="you@kompasspakistan.com.pk"
                            required
                            autofocus
                        >

                    </div>


                    <div class="form-group">

                        <label class="field-label">
                            Password
                        </label>

                        <input
                            class="form-control"
                            type="password"
                            name="password"
                            placeholder="••••••••"
                            required
                        >

                    </div>


                    <div
                        class="form-group"
                        style="display:flex;align-items:center;justify-content:space-between;gap:8px;"
                    >

                        <span
                            style="display:flex;align-items:center;gap:8px;"
                        >

                            <input
                                type="checkbox"
                                name="remember"
                                id="remember"
                            >

                            <label
                                for="remember"
                                style="font-size:13px;color:var(--muted);margin:0;"
                            >
                                Remember me next time
                            </label>

                        </span>


                        <a
                            href="/forgot-password"
                            style="font-size:13px;"
                        >
                            Forgot password?
                        </a>

                    </div>


                    <button
                        class="btn btn-primary"
                        type="submit"
                        style="width:100%;justify-content:center;margin-top:6px;"
                    >
                        Log In
                    </button>

                </form>


                <div class="auth-links">

                    Don't have an account?

                    <a href="{% url 'signup' %}">
                        Sign Up
                    </a>

                </div>

            </div>

        </div>

    </main>

</body>
</html>
